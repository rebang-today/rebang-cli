# goreleaser 配置（D-55）。由 .github/workflows/release.yml 在推送 v* tag 时执行。
# 本地试跑：make snapshot（不发布、不签名）。
version: 2
project_name: rebang

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: rebang
    main: ./cmd/rebang
    binary: rebang
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rebang-today/rebang-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/rebang-today/rebang-cli/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/rebang-today/rebang-cli/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: rebang
    # 安装包名与 tools/manifestgen、scripts/install.* 约定一致，修改时需同步。
    name_template: "rebang_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# minisign 签名每个安装包，生成 <安装包>.minisig；公钥内置在 internal/update/minisign.pub（D-52）。
signs:
  - id: minisign
    cmd: minisign
    artifacts: archive
    signature: "${artifact}.minisig"
    # 密码末尾需要换行，minisign 按行读取。
    stdin: "{{ .Env.MINISIGN_PASSWORD }}\n"
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
      - -t
      - "rebang {{ .Version }} ${artifactName}"

release:
  github:
    owner: rebang-today
    name: rebang-cli
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"

# 使用 formula 而不是 cask：formula 安装不带隔离属性，未签名的程序也能直接运行（D-71）。
brews:
  - name: rebang
    repository:
      owner: rebang-today
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://rebang.today
    description: 今日热榜（rebang.today）官方命令行客户端
    license: Apache-2.0
    skip_upload: auto
    commit_author:
      name: rebang-today
      email: admin@rebang.today
    commit_msg_template: "rebang {{ .Tag }}"
    install: |
      bin.install "rebang"
    test: |
      system "#{bin}/rebang", "version"

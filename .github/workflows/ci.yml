name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal tools)" || (gofmt -l cmd internal tools; exit 1)
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      - name: go test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: shellcheck scripts/install.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
      - name: manifest
        run: go run ./tools/manifestgen -version "$(jq -r .version dist/metadata.json)" -base-url https://example.invalid/cli -o dist/manifest.json && cat dist/manifest.json
